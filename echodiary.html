<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fbf8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>回声日记 · Echo Diary</title>
<style>
:root{--paper:#fbf8f1;--paper-deep:#f1eadf;--ink:#2f2a24;--muted:#827a6e;--line:#e3dbce;--leaf:#66815b;--leaf-soft:#e7eee2;--amber:#b8874b;--amber-soft:#f4ead9;--rust:#a65f4d;--white:#fffdf9;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;--hand:"Kaiti SC","STKaiti","FZKai-Z03","KaiTi",serif;--display:"Hiragino Mincho ProN","Yu Mincho","Noto Serif SC","Songti SC",serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html{background:#26231f}body{max-width:1180px;margin:auto;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7;padding:env(safe-area-inset-top) 28px calc(42px + env(safe-area-inset-bottom));}button,input{font:inherit}button{cursor:pointer}a{color:inherit}.shell{max-width:1080px;margin:auto}.mast{display:flex;align-items:flex-end;justify-content:space-between;padding:42px 0 22px;border-bottom:1px solid var(--line)}.brand-kicker{font:11px var(--sans);letter-spacing:.2em;color:var(--leaf);text-transform:uppercase}.brand{font:500 34px var(--display);letter-spacing:.18em;margin-top:5px;text-shadow:0 1px 0 #fff}.brand-sub{font:12px var(--hand);color:var(--muted);margin-top:5px;letter-spacing:.08em}.mast-side{text-align:right;color:var(--muted);font:12px var(--hand)}.mast-side strong{display:block;color:var(--ink);font:500 21px var(--display);font-weight:500;margin-bottom:3px;letter-spacing:.08em}.tabs{display:flex;gap:24px;padding:14px 0;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:none;color:var(--muted);font:13px var(--sans);padding:4px 0;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-color:var(--amber);font-weight:600}.view{display:none}.view.active{display:block}.today-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;margin:26px 0 34px}.hero{position:relative;overflow:hidden;background:var(--ink);color:#f8f1e5;min-height:315px;padding:34px 38px 30px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:4px}.hero:before{content:"";position:absolute;right:-70px;top:-90px;width:250px;height:250px;border:1px solid rgba(244,234,217,.3);border-radius:50%}.hero:after{content:"";position:absolute;right:15px;top:45px;width:130px;height:130px;border:1px solid rgba(244,234,217,.17);border-radius:50%}.hero-empty{background:var(--leaf);}.hero-label{font:11px var(--sans);letter-spacing:.18em;color:#d9c29b;text-transform:uppercase;margin-bottom:15px}.hero h1{font:500 40px/1.28 var(--display);letter-spacing:.06em;max-width:720px;position:relative;z-index:1}.hero h1:after{content:"";display:block;width:58px;height:1px;background:#d9c29b;margin-top:17px}.hero p{font:16px/2.15 var(--hand);color:#ded5c7;max-width:650px;margin-top:15px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;position:relative;z-index:1}.hero-actions{display:flex;gap:9px;margin-top:22px;position:relative;z-index:1}.btn{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:4px;padding:8px 14px;font-size:12px}.btn-dark{border-color:#9b8b76;background:transparent;color:#f8f1e5}.btn-leaf{border:0;background:var(--leaf);color:#fff;padding:9px 15px;border-radius:4px;font-size:12px}.aside{background:var(--paper-deep);padding:22px 21px;border-left:3px solid var(--amber);display:flex;flex-direction:column;justify-content:space-between}.aside-title{font:500 22px var(--display);letter-spacing:.05em;margin-bottom:13px}.aside-note{font:13px/1.9 var(--hand);color:var(--muted)}.stat-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.stat{border-top:1px solid #d7cbbb;padding-top:8px}.stat b{display:block;font:25px var(--serif);font-weight:500}.stat span{font-size:11px;color:var(--muted)}.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 0 13px}.section-head h2{font:500 25px var(--display);letter-spacing:.06em}.section-head p{font:12px var(--hand);color:var(--muted);letter-spacing:.08em}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--white);padding:9px 12px;border-radius:4px;color:var(--ink);font-size:13px}.select{border:1px solid var(--line);background:var(--white);padding:9px 10px;border-radius:4px;color:var(--ink);font-size:12px}.story-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}.story{background:var(--white);min-height:205px;padding:23px 24px;position:relative;cursor:pointer;transition:background .18s}.story:hover{background:#f7f2e8}.story-date{font-size:11px;color:var(--muted);letter-spacing:.08em}.story-title{font:500 23px/1.4 var(--display);margin:13px 0 8px;letter-spacing:.04em;padding-right:26px}.story-preview{font:15px/2.05 var(--serif);color:#61594e;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.story-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:17px}.tag{font-size:10px;color:var(--leaf);background:var(--leaf-soft);padding:2px 7px;border-radius:2px}.fav{position:absolute;right:20px;top:20px;border:0;background:none;color:#c2b8a8;font-size:19px}.fav.on{color:var(--amber)}.empty{padding:65px 18px;text-align:center;color:var(--muted);background:var(--white);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font:24px var(--serif);font-weight:500;margin-bottom:8px}.calendar{border:1px solid var(--line);background:var(--white);padding:20px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.cal-head h2{font:23px var(--serif);font-weight:500}.cal-nav{border:1px solid var(--line);background:var(--paper);padding:5px 9px;color:var(--muted)}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-week,.cal-day{min-height:47px;padding:6px;border:1px solid transparent}.cal-week{text-align:center;font-size:11px;color:var(--muted)}.cal-day{background:var(--paper);font-size:12px;position:relative;cursor:pointer}.cal-day.other{opacity:.35}.cal-day.has{border-color:#d1ddc9}.cal-day.today{outline:2px solid var(--amber);outline-offset:-2px}.cal-dot{position:absolute;bottom:7px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--leaf)}.cal-day.fav-day .cal-dot{background:var(--amber)}.materials{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.material{background:var(--white);padding:19px}.material small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.material b{font:500 20px var(--display);letter-spacing:.04em}.material p{font:12px/1.8 var(--hand);color:#696154;margin-top:5px}.footer{margin-top:36px;border-top:1px solid var(--line);padding-top:19px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.reader,.editor{position:fixed;inset:0;z-index:50;display:none;overflow-y:auto;background:var(--paper);padding:env(safe-area-inset-top) 28px calc(40px + env(safe-area-inset-bottom))}.reader.open,.editor.open{display:block}.reader-inner,.editor-inner{max-width:760px;margin:auto}.reader-bar,.editor-bar{display:flex;justify-content:space-between;align-items:center;padding:25px 0 16px}.icon-btn{border:0;background:none;color:var(--muted);font-size:14px;padding:8px}.reader-meta{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.14em;margin-top:35px}.reader-title{text-align:center;font:500 39px/1.4 var(--display);letter-spacing:.05em;margin:12px 0 21px}.reader-rule{height:1px;width:58px;background:var(--amber);margin:0 auto 32px}.reader-body{font:18px/2.35 var(--serif);color:#484137;white-space:pre-wrap;text-align:justify;letter-spacing:.03em}.reader-actions{display:flex;justify-content:center;gap:9px;padding:34px 0}.editor-title{font:500 22px var(--display);letter-spacing:.06em}.editor input,.editor textarea{width:100%;border:1px solid var(--line);background:var(--white);border-radius:4px;padding:12px 13px;color:var(--ink);font-size:14px}.editor textarea{height:55vh;resize:none;margin-top:11px;font:16px/2 var(--serif)}#toast{position:fixed;z-index:100;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#f8f1e5;border-radius:4px;padding:9px 15px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}@media(max-width:750px){body{padding-left:16px;padding-right:16px}.mast{padding-top:28px}.brand{font-size:27px}.mast-side strong{font-size:17px}.today-layout{grid-template-columns:1fr}.hero{min-height:330px;padding:28px 25px}.hero h1{font-size:31px}.aside{min-height:190px}.story-list{grid-template-columns:1fr}.materials{grid-template-columns:repeat(2,1fr)}.cal-day{min-height:40px}.reader-title{font-size:30px}.reader-body{font-size:16px}}
</style>
</head>
<body>
<div class="shell">
<header class="mast"><div><div class="brand-kicker">personal life archive</div><div class="brand">回声日记</div><div class="brand-sub">你的一天，被写成一篇小小的散文</div></div><div class="mast-side"><strong id="mastDate"></strong><span id="mastMoon"></span></div></header>
<nav class="tabs"><button class="tab active" data-view="today">今日回声</button><button class="tab" data-view="stories">日记流</button><button class="tab" data-view="calendar">日历回顾</button><button class="tab" data-view="materials">素材档案</button></nav>
<main>
<section class="view active" id="view-today"><div class="today-layout"><div class="hero" id="todayHero"></div><aside class="aside"><div><div class="aside-title">今天留下了什么</div><p class="aside-note">这里不是数据报表，而是这一天写作时可以依靠的生活证据。照片和插画入口会在下一阶段接入。</p></div><div class="stat-list"><div class="stat"><b id="todayWords">0</b><span>今日字数</span></div><div class="stat"><b id="todayTags">0</b><span>生活线索</span></div><div class="stat"><b id="totalDays">0</b><span>记录天数</span></div><div class="stat"><b id="totalWords">0</b><span>累计字数</span></div></div></aside></div><div class="section-head"><div><h2>今日素材</h2><p>日记的骨架与血肉</p></div><button class="btn" onclick="switchView('materials')">查看档案</button></div><div class="materials" id="todayMaterials"></div></section>
<section class="view" id="view-stories"><div class="section-head"><div><h2>日记流</h2><p>把时间翻回去，看看那时的你</p></div><button class="btn-leaf" onclick="openEditor()">写一篇</button></div><div class="toolbar"><input class="search" id="searchInput" placeholder="搜索日期、标题或正文" oninput="renderStories()"><select class="select" id="monthSelect" onchange="renderStories()"><option value="all">全部月份</option></select><button class="btn" id="favFilter" onclick="toggleFavFilter()">只看收藏</button></div><div class="story-list" id="storyList"></div></section>
<section class="view" id="view-calendar"><div class="section-head"><div><h2>日历回顾</h2><p>有文字的日子，会留下一个小点</p></div><button class="btn-leaf" onclick="openEditor()">写一篇</button></div><div class="calendar"><div class="cal-head"><button class="cal-nav" onclick="changeMonth(-1)">上一月</button><h2 id="calTitle"></h2><button class="cal-nav" onclick="changeMonth(1)">下一月</button></div><div class="cal-grid" id="calGrid"></div></div></section>
<section class="view" id="view-materials"><div class="section-head"><div><h2>素材档案</h2><p>文字线索与生活坐标</p></div></div><div class="materials" id="archiveMaterials"></div><div class="empty" style="margin-top:16px"><strong>把生活写下来</strong><p>这里会持续汇集你的文字、日期和生活线索。</p></div></section>
</main>
<footer class="footer"><span>Echo Diary · editorial life archive</span><span id="syncSlot"></span></footer>
</div>
<div class="reader" id="reader"><div class="reader-inner"><div class="reader-bar"><button class="icon-btn" onclick="closeReader()">返回日记流</button><div><button class="icon-btn" onclick="toggleCurrentFavorite()" id="readerFav">收藏</button><button class="icon-btn" onclick="editCurrent()">编辑</button></div></div><div class="reader-meta" id="readerMeta"></div><div class="reader-title" id="readerTitle"></div><div class="reader-rule"></div><div class="reader-body" id="readerBody"></div><div class="reader-actions"><button class="btn" onclick="copyCurrent()">复制全文</button><button class="btn" onclick="deleteCurrent()">删除</button></div></div></div>
<div class="editor" id="editor"><div class="editor-inner"><div class="editor-bar"><button class="icon-btn" onclick="closeEditor()">取消</button><div class="editor-title" id="editorTitle">写一篇</div><button class="btn-leaf" onclick="saveEditor()">保存</button></div><input id="edDate" placeholder="日期 YYYY-MM-DD"><input id="edHead" placeholder="标题（可留空）" style="margin-top:10px"><textarea id="edBody" placeholder="落笔……"></textarea></div></div>
<div id="toast"></div>
<script>
const DKEY='zhaozhao-diary',WEEK=['日','一','二','三','四','五','六'],MOONS=['新月','眉月','上弦','盈凸','满月','亏凸','下弦','残月'];let current=null,favOnly=false,calDate=new Date();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function loadDiary(){try{return JSON.parse(localStorage.getItem(DKEY)||'[]');}catch(e){return[];}}
function saveDiary(a){localStorage.setItem(DKEY,JSON.stringify(a));renderAll();}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthKey(d){return d.slice(0,7)}
function moonOf(s){const syn=29.530588853,days=(new Date(s+'T12:00:00')-new Date('2000-01-06T18:14:00Z'))/86400000;return MOONS[Math.floor((((days%syn)+syn)%syn)/syn*8)%8];}
function today(){return fmtDate(new Date())}
function tagsOf(x){const text=(x.title||'')+' '+(x.content||''),words=['散步','河边','天气','会议','工作','阅读','晚饭','午饭','朋友','雨','风','月亮','夜','公司','家','秋','累','开心','安静'];return words.filter(w=>text.includes(w)).slice(0,4)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function sorted(){return loadDiary().slice().sort((a,b)=>a.date<b.date?1:-1)}
function openReader(id){const x=loadDiary().find(a=>a.id===id);if(!x)return;current=x;document.getElementById('readerMeta').textContent=x.date+' · 周'+WEEK[new Date(x.date+'T12:00:00').getDay()]+' · '+moonOf(x.date);document.getElementById('readerTitle').textContent=x.title||'回声';document.getElementById('readerBody').textContent=x.content||'';document.getElementById('readerFav').textContent=x.favorite?'已收藏':'收藏';document.getElementById('reader').classList.add('open')}
function closeReader(){document.getElementById('reader').classList.remove('open')}
function toggleCurrentFavorite(){if(!current)return;const a=loadDiary(),x=a.find(v=>v.id===current.id);if(x){x.favorite=!x.favorite;current=x;saveDiary(a);document.getElementById('readerFav').textContent=x.favorite?'已收藏':'收藏';toast(x.favorite?'已收藏':'已取消收藏')}}
function copyCurrent(){if(!current)return;const text=current.title+'\n\n'+current.content+'\n\n—— 回声日记 '+current.date;if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('已复制全文'));}
function deleteCurrent(){if(!current||!confirm('确定删除 '+current.date+' 这一篇？'))return;saveDiary(loadDiary().filter(x=>x.id!==current.id));closeReader();toast('已删除')}
function editCurrent(){if(current){closeReader();openEditor(current)}}
function openEditor(x){document.getElementById('editorTitle').textContent=x?'修改日记':'写一篇';document.getElementById('edDate').value=x?x.date:today();document.getElementById('edHead').value=x?(x.title||''):'';document.getElementById('edBody').value=x?(x.content||''):'';document.getElementById('editor').dataset.id=x?x.id:'';document.getElementById('editor').classList.add('open')}
function closeEditor(){document.getElementById('editor').classList.remove('open')}
function saveEditor(){const date=document.getElementById('edDate').value.trim(),title=document.getElementById('edHead').value.trim(),content=document.getElementById('edBody').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('日期格式应为 YYYY-MM-DD');return}if(!content){toast('正文不能为空');return}const a=loadDiary(),id=document.getElementById('editor').dataset.id;let x=id?a.find(v=>v.id===id):{id:'e'+Date.now().toString(36),date,title,content,createdAt:new Date().toISOString()};if(!x)return;x.date=date;x.title=title;x.content=content;if(!id)a.push(x);saveDiary(a);closeEditor();toast('日记已保存')}
function hero(){const x=sorted().find(v=>v.date===today()),h=document.getElementById('todayHero');if(!x){h.className='hero hero-empty';h.innerHTML='<div class="hero-label">Today’s echo</div><h1>今天还没有被写下来。</h1><p>等今晚的快捷指令，或者现在就留下一小段文字，让这一天有一个温柔的落点。</p><div class="hero-actions"><button class="btn-dark" onclick="openEditor()">现在写一篇</button></div>';return}h.className='hero';const first=(x.content||'').split('\n').find(v=>v.trim())||'今天的回声已经收下。';h.innerHTML='<div class="hero-label">Today’s echo · '+esc(x.date)+'</div><h1>'+esc(x.title||first.slice(0,22))+'</h1><p>'+esc(x.content||'')+'</p><div class="hero-actions"><button class="btn-dark" onclick="openReader(\''+esc(x.id)+'\')">进入沉浸阅读</button><button class="btn-dark" onclick="toggleFavoriteById(\''+esc(x.id)+'\')">'+(x.favorite?'已收藏':'收藏这一天')+'</button></div>'}
function toggleFavoriteById(id){const a=loadDiary(),x=a.find(v=>v.id===id);if(x){x.favorite=!x.favorite;saveDiary(a);toast(x.favorite?'已收藏':'已取消收藏')}}
function renderStats(){const a=sorted(),td=a.find(x=>x.date===today()),days=new Set(a.map(x=>x.date));document.getElementById('todayWords').textContent=td?(td.content||'').length:0;document.getElementById('todayTags').textContent=td?tagsOf(td).length:0;document.getElementById('totalDays').textContent=days.size;document.getElementById('totalWords').textContent=a.reduce((n,x)=>n+(x.content||'').length,0);document.getElementById('mastDate').textContent=today().replaceAll('-','.');document.getElementById('mastMoon').textContent=moonOf(today())}
function materials(){const x=sorted().find(v=>v.date===today()),items=x?[['文字','正文',((x.content||'').length)+' 字'],['日期','时间坐标',x.date],['线索','自动提取',tagsOf(x).join(' · ')||'等待更多素材'],['视觉','照片与插画','下一阶段接入']]:[['文字','今日正文','尚未生成'],['日期','时间坐标',today()],['线索','自动提取','等待今晚的回声'],['视觉','照片与插画','下一阶段接入']];return items.map(a=>'<div class="material"><small>'+a[0]+' · '+a[1]+'</small><b>'+esc(a[2])+'</b><p>'+esc(a[0]==='视觉'?'每日一张主插画，作为当天的视觉记忆。':'它会成为今天散文的一部分。')+'</p></div>').join('')}
function renderStories(){const a=sorted(),q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase(),m=document.getElementById('monthSelect')?.value||'all',list=a.filter(x=>(m==='all'||monthKey(x.date)===m)&&(!favOnly||x.favorite)&&(!q||((x.title||'')+' '+(x.content||'')+' '+x.date).toLowerCase().includes(q))),box=document.getElementById('storyList');box.innerHTML=list.length?list.map(x=>{const tags=tagsOf(x);return '<article class="story" onclick="openReader(\''+esc(x.id)+'\')"><button class="fav '+(x.favorite?'on':'')+'" onclick="event.stopPropagation();toggleFavoriteById(\''+esc(x.id)+'\')">'+(x.favorite?'●':'○')+'</button><div class="story-date">'+esc(x.date)+' · 周'+WEEK[new Date(x.date+'T12:00:00').getDay()]+' · '+moonOf(x.date)+'</div><h3 class="story-title">'+esc(x.title||'回声')+'</h3><p class="story-preview">'+esc(x.content||'')+'</p><div class="story-foot">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></article>'}).join(''):'<div class="empty"><strong>还没有符合条件的回声</strong><p>换个关键词，或者先写下今天。</p></div>'}
function fillMonths(){const s=document.getElementById('monthSelect'),old=s.value||'all',ms=[...new Set(sorted().map(x=>monthKey(x.date)))];s.innerHTML='<option value="all">全部月份</option>'+ms.map(m=>'<option value="'+m+'">'+m.replace('-',' 年 ')+' 月</option>').join('');s.value=ms.includes(old)?old:'all'}
function toggleFavFilter(){favOnly=!favOnly;document.getElementById('favFilter').textContent=favOnly?'显示全部':'只看收藏';renderStories()}
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth(),a=sorted(),map={};a.forEach(x=>map[x.date]=x);document.getElementById('calTitle').textContent=y+' 年 '+(m+1)+' 月';const first=new Date(y,m,1),start=first.getDay(),last=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];['日','一','二','三','四','五','六'].forEach(d=>cells.push('<div class="cal-week">'+d+'</div>'));for(let i=0;i<42;i++){const num=i-start+1,d=new Date(y,m,num),key=fmtDate(d),x=map[key],other=num<1||num>last;cells.push('<div class="cal-day '+(other?'other ':'')+(x?'has ':'')+(key===today()?'today ':'')+(x&&x.favorite?'fav-day':'')+'" onclick="'+(x?'openReader(\''+esc(x.id)+'\')':'')+'">'+d.getDate()+(x?'<i class="cal-dot"></i>':'')+'</div>')}document.getElementById('calGrid').innerHTML=cells.join('')}
function switchView(v){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));if(v==='stories'){fillMonths();renderStories()}if(v==='calendar')renderCalendar()}
function renderAll(){hero();renderStats();document.getElementById('todayMaterials').innerHTML=materials();document.getElementById('archiveMaterials').innerHTML=materials();fillMonths();renderStories();renderCalendar()}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
(function handleSave(){if(location.hash.indexOf('#save')!==0)return;const q=new URLSearchParams(location.hash.slice(5)),date=q.get('d')||today(),title=(q.get('t')||'').trim(),content=q.get('c')||'';if(content&&/^\d{4}-\d{2}-\d{2}$/.test(date)){const a=loadDiary(),old=a.find(x=>x.date===date&&x.auto),item={id:old?old.id:'a'+date.replace(/-/g,''),date,title,content,auto:true,createdAt:new Date().toISOString(),favorite:old?!!old.favorite:false};if(old)a[a.indexOf(old)]=item;else a.push(item);localStorage.setItem(DKEY,JSON.stringify(a))}history.replaceState(null,'',location.pathname)})();
function buildNav(){renderAll()}
renderAll();
