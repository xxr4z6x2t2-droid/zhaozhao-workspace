<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f0e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>回声日记 · Echo Diary</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:#171512; }
  body {
    font-family:-apple-system,"PingFang SC","Songti SC","STSong",serif;
    background:linear-gradient(180deg,#f7f2e7 0%,#f2ecdd 100%);
    min-height:100vh; color:#3a352c; line-height:1.8;
    padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  ::selection { background:#e8d9b8; }

  /* ===== 顶部 ===== */
  header { padding:34px 6px 6px; display:flex; align-items:flex-end; justify-content:space-between; }
  h1 { font-size:24px; font-weight:600; letter-spacing:3px; }
  h1 .moon { font-size:20px; vertical-align:-2px; margin-right:6px; }
  .today { font-size:12.5px; color:#a3987f; letter-spacing:1px; }
  .stats { display:flex; gap:10px; padding:14px 6px 18px; }
  .stat { flex:1; background:rgba(255,255,253,.72); border:1px solid #e6dcc6; border-radius:12px; padding:10px 8px; text-align:center; }
  .stat b { display:block; font-size:20px; color:#6b5d45; font-family:Georgia,serif; }
  .stat span { font-size:11px; color:#a3987f; letter-spacing:1px; }

  /* ===== 卡片流 ===== */
  .cards { display:flex; flex-direction:column; gap:14px; padding-bottom:24px; }
  .card {
    background:rgba(255,255,251,.86); border:1px solid #e8dfcc; border-radius:16px;
    padding:18px 20px 16px; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:0 1px 4px rgba(90,75,45,.06);
    transition:transform .15s ease, box-shadow .15s ease;
    animation:rise .5s ease both;
  }
  @keyframes rise { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none;} }
  .card:active { transform:scale(.985); }
  .card .d { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  .card .date { font-size:17px; font-weight:600; color:#4a4235; letter-spacing:1px; }
  .card .wk { font-size:12px; color:#a89a80; }
  .card .mp { position:absolute; right:18px; top:16px; font-size:18px; opacity:.8; }
  .card .preview { font-size:14px; color:#6b6353; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card .first { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; font-weight:600; color:#57503f; margin-bottom:2px; }
  .empty { text-align:center; padding:60px 20px; color:#a89a80; }
  .empty .big { font-size:44px; margin-bottom:14px; }
  .empty p { font-size:14px; }

  /* ===== 底部操作 ===== */
  .fab {
    position:fixed; bottom:calc(22px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:#5a4f3d; color:#f7f2e7; border:none; border-radius:24px;
    font-size:15px; letter-spacing:2px; padding:12px 30px; font-family:inherit;
    box-shadow:0 4px 16px rgba(80,65,40,.35); cursor:pointer; z-index:20;
  }
  .fab:active { transform:translateX(-50%) scale(.96); }
  .synczone { margin-top:20px; padding:14px 6px 0; border-top:1px dashed #e0d5bd; font-size:12px; }
  .synczone .sync-status { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; color:#a3987f; padding:8px 0; }
  .synczone .sync-form { display:flex; flex-direction:column; gap:8px; padding:8px 0; }
  .synczone input {
    border:1px solid #ddd2ba; border-radius:9px; padding:9px 12px; font-size:13px;
    background:rgba(255,255,252,.9); font-family:inherit; color:#3a352c;
  }
  .synczone .btn-primary {
    background:#5a4f3d; color:#f7f2e7; border:none; border-radius:9px;
    padding:10px; font-size:14px; font-family:inherit; cursor:pointer;
  }
  .synczone .btn-secondary {
    background:transparent; color:#8a7d63; border:1px solid #cfc3a8; border-radius:9px;
    padding:9px; font-size:13px; font-family:inherit; cursor:pointer;
  }
  .synczone .backup-actions { display:flex; gap:8px; }
  .synczone a { color:#8a7d63; }

  /* ===== 阅读层 ===== */
  .reader {
    position:fixed; inset:0; background:linear-gradient(180deg,#f9f5ec,#f3edde);
    z-index:50; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:env(safe-area-inset-top) 22px calc(40px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
    display:none; animation:fade .3s ease;
  }
  @keyframes fade { from { opacity:0;} to { opacity:1;} }
  .reader.open { display:block; }
  .reader .bar { display:flex; justify-content:space-between; align-items:center; padding:18px 0 8px; }
  .reader .bar button { background:none; border:none; font-size:24px; cursor:pointer; color:#8a7d63; font-family:inherit; }
  .reader .rd-date { text-align:center; font-size:15px; color:#a3987f; letter-spacing:3px; margin:22px 0 4px; }
  .reader .rd-title { text-align:center; font-size:22px; color:#4a4235; letter-spacing:2px; margin-bottom:6px; }
  .reader .rd-hr { width:44px; height:1px; background:#c9bb9c; margin:16px auto 26px; }
  .reader .rd-body { font-size:16.5px; line-height:2.15; color:#4c4536; letter-spacing:.4px; white-space:pre-wrap; text-align:justify; padding-bottom:20px; }
  .reader .rd-acts { display:flex; gap:10px; justify-content:center; padding:10px 0 26px; }
  .reader .rd-acts button {
    background:none; border:1px solid #cfc3a8; color:#8a7d63; border-radius:18px;
    padding:7px 20px; font-size:13px; font-family:inherit; cursor:pointer;
  }

  /* ===== 编辑层 ===== */
  .editor {
    position:fixed; inset:0; background:#f7f2e7; z-index:60;
    display:none; flex-direction:column; padding:env(safe-area-inset-top) 18px calc(20px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  .editor.open { display:flex; }
  .editor .bar { display:flex; justify-content:space-between; align-items:center; padding:16px 0; }
  .editor .bar .t { font-size:16px; letter-spacing:2px; color:#4a4235; }
  .editor .bar .x { background:none; border:none; font-size:24px; color:#8a7d63; cursor:pointer; font-family:inherit; }
  .editor input, .editor textarea {
    border:1px solid #ddd2ba; border-radius:12px; padding:12px 14px; font-size:15px;
    background:rgba(255,255,252,.92); font-family:inherit; color:#3a352c; width:100%;
  }
  .editor textarea { flex:1; resize:none; line-height:2; margin-top:12px; font-size:16px; }
  .editor .done {
    background:#5a4f3d; color:#f7f2e7; border:none; border-radius:12px;
    font-size:15px; letter-spacing:2px; padding:13px; margin-top:12px; font-family:inherit; cursor:pointer;
  }

  /* ===== toast ===== */
  #toast {
    position:fixed; top:calc(20px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:rgba(60,52,40,.92); color:#f5efe2; border-radius:22px;
    padding:10px 22px; font-size:14px; letter-spacing:1px; z-index:99;
    opacity:0; pointer-events:none; transition:opacity .3s; white-space:nowrap; max-width:88vw; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <h1><span class="moon" id="todayMoon">🌙</span>回声日记</h1>
  <div class="today" id="todayStr"></div>
</header>

<div class="stats">
  <div class="stat"><b id="stCount">0</b><span>篇</span></div>
  <div class="stat"><b id="stStreak">0</b><span>连续天数</span></div>
  <div class="stat"><b id="stWords">0</b><span>累计字数</span></div>
</div>

<div class="cards" id="cards"></div>

<button class="fab" onclick="openEditor()">✍️ 写一篇</button>

<div class="synczone">
  <div id="syncSection"></div>
  <p style="color:#b3a88f;text-align:center;padding:6px 0 0">每晚由快捷指令自动写入 · 数据经云同步跨设备保留</p>
</div>

<!-- 阅读层 -->
<div class="reader" id="reader">
  <div class="bar">
    <button onclick="closeReader()">‹</button>
    <button onclick="editCurrent()">✎</button>
  </div>
  <div class="rd-date" id="rdDate"></div>
  <div class="rd-title" id="rdTitle"></div>
  <div class="rd-hr"></div>
  <div class="rd-body" id="rdBody"></div>
  <div class="rd-acts">
    <button onclick="copyCurrent()">复制全文</button>
    <button onclick="deleteCurrent()">删除</button>
  </div>
</div>

<!-- 编辑层 -->
<div class="editor" id="editor">
  <div class="bar">
    <button class="x" onclick="closeEditor()">✕</button>
    <span class="t" id="edTitle">写一篇</span>
    <span style="width:24px"></span>
  </div>
  <input type="text" id="edDate" placeholder="日期（如 2026-08-19）">
  <input type="text" id="edHead" placeholder="标题（可留空）" style="margin-top:12px">
  <textarea id="edBody" placeholder="落笔……"></textarea>
  <button class="done" onclick="saveEditor()">保存</button>
</div>

<div id="toast"></div>

<script>
// ===== 回声日记 — 数据与渲染（localStorage: zhaozhao-diary）=====
// 结构：[{ id, date:'YYYY-MM-DD', title, content, createdAt }]
const DKEY = 'zhaozhao-diary';
const WEEK = ['日','一','二','三','四','五','六'];
const MOONS = ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function loadDiary(){ try { return JSON.parse(localStorage.getItem(DKEY) || '[]'); } catch(e){ return []; } }
function saveDiary(arr){ localStorage.setItem(DKEY, JSON.stringify(arr)); render(); }
function fmtDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function moonOf(dateStr){
  // 简化月相：以 2000-01-06 新月为基准
  const synodic = 29.530588853;
  const days = (new Date(dateStr + 'T12:00:00') - new Date('2000-01-06T18:14:00Z')) / 86400000;
  const phase = ((days % synodic) + synodic) % synodic / synodic;
  return MOONS[Math.floor(phase * 8) % 8];
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function render(){
  const arr = loadDiary().slice().sort((a,b) => a.date < b.date ? 1 : -1);
  const box = document.getElementById('cards');
  // 统计
  document.getElementById('stCount').textContent = arr.length;
  document.getElementById('stWords').textContent = arr.reduce((s,x) => s + (x.content||'').length, 0);
  const dates = new Set(arr.map(x => x.date));
  let streak = 0, cur = new Date();
  // 今天还没写则从昨天起算
  if (!dates.has(fmtDate(cur))) cur.setDate(cur.getDate() - 1);
  while (dates.has(fmtDate(cur))) { streak++; cur.setDate(cur.getDate() - 1); }
  document.getElementById('stStreak').textContent = streak;

  if (!arr.length) {
    box.innerHTML = '<div class="empty"><div class="big">🌙</div><p>还没有回声。<br>等今晚 23:00，快捷指令会把今天写成散文。<br>或者现在就 <a href="javascript:void(0)" onclick="openEditor()" style="color:#8a7d63">亲手写一篇</a>。</p></div>';
    return;
  }
  box.innerHTML = arr.map((x,i) => {
    const wk = WEEK[new Date(x.date + 'T12:00:00').getDay()];
    const firstLine = (x.content||'').split('\n').find(l => l.trim()) || '';
    return `<div class="card" style="animation-delay:${Math.min(i*0.06,0.3)}s" onclick="openReader('${esc(x.id)}')">
      <span class="mp">${moonOf(x.date)}</span>
      <div class="d"><span class="date">${esc(x.date)}</span><span class="wk">周${wk}${x.title ? ' · ' + esc(x.title) : ''}</span></div>
      <div class="first">${esc(x.title || firstLine)}</div>
      <div class="preview">${esc(x.content||'')}</div>
    </div>`;
  }).join('');
}

// ===== 阅读层 =====
let _cur = null;
function openReader(id){
  const it = loadDiary().find(x => x.id === id); if (!it) return;
  _cur = it;
  const wk = WEEK[new Date(it.date + 'T12:00:00').getDay()];
  document.getElementById('rdDate').textContent = it.date + ' · 周' + wk + ' · ' + moonOf(it.date);
  document.getElementById('rdTitle').textContent = it.title || '回声';
  document.getElementById('rdBody').textContent = it.content || '';
  document.getElementById('reader').classList.add('open');
  document.getElementById('reader').scrollTop = 0;
}
function closeReader(){ document.getElementById('reader').classList.remove('open'); }
function copyCurrent(){
  const txt = (_cur.content||'') + '\n\n—— 回声日记 ' + _cur.date;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('已复制到剪贴板'));
  else { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制'); }
}
function deleteCurrent(){
  if (!confirm('删除 ' + _cur.date + ' 这一篇？')) return;
  saveDiary(loadDiary().filter(x => x.id !== _cur.id));
  closeReader(); toast('已删除');
}
function editCurrent(){ closeEditorForReader(); const it = _cur; if (!it) return; openEditor(it); }

// ===== 编辑层 =====
function openEditor(it){
  document.getElementById('edTitle').textContent = it ? '修改' : '写一篇';
  document.getElementById('edDate').value = it ? it.date : fmtDate(new Date());
  document.getElementById('edHead').value = it ? (it.title||'') : '';
  document.getElementById('edBody').value = it ? (it.content||'') : '';
  document.getElementById('editor').classList.add('open');
  document.getElementById('editor').dataset.id = it ? it.id : '';
}
function closeEditorForReader(){ document.getElementById('editor').classList.remove('open'); }
function saveEditor(){
  const date = document.getElementById('edDate').value.trim();
  const title = document.getElementById('edHead').value.trim();
  const content = document.getElementById('edBody').value.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('日期格式：YYYY-MM-DD'); return; }
  if (!content) { toast('内容不能为空'); return; }
  const arr = loadDiary();
  const id = document.getElementById('editor').dataset.id;
  if (id) {
    const it = arr.find(x => x.id === id);
    if (it) { it.date = date; it.title = title; it.content = content; }
  } else {
    // 同一天手动新写：与快捷指令不同，允许多篇（id 唯一）
    arr.push({ id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), date, title, content, createdAt: new Date().toISOString() });
  }
  saveDiary(arr);
  closeEditorForReader(); toast('已保存 ✨');
}

// ===== 快捷指令写入模式：#save&d=YYYY-MM-DD&t=标题&c=正文(URL编码) =====
// 快捷指令最后一动作用「打开 URL」指向本页即可存入；同一天自动覆盖旧篇
(function handleSave(){
  if (location.hash.indexOf('#save') !== 0) return;
  const q = new URLSearchParams(location.hash.slice(5));
  const date = q.get('d') || fmtDate(new Date());
  const title = (q.get('t') || '').trim();
  const content = q.get('c') || '';
  if (!content) { history.replaceState(null,'',location.pathname); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { history.replaceState(null,'',location.pathname); return; }
  const arr = loadDiary();
  const exist = arr.find(x => x.date === date && x.auto);
  const item = { id: exist ? exist.id : 'a' + date.replace(/-/g,''), date, title, content, auto: true, createdAt: new Date().toISOString() };
  if (exist) arr[arr.indexOf(exist)] = item; else arr.push(item);
  localStorage.setItem(DKEY, JSON.stringify(arr));
  history.replaceState(null, '', location.pathname); // 清掉 URL 里的日记内容
  setTimeout(() => toast('🌙 今天的回声已收下'), 400);
})();

// ===== 顶部日期 + 今日月相 =====
(function(){
  const now = new Date();
  document.getElementById('todayStr').textContent = now.getFullYear() + ' 年 ' + (now.getMonth()+1) + ' 月 ' + now.getDate() + ' 日 · 周' + WEEK[now.getDay()];
  document.getElementById('todayMoon').textContent = moonOf(fmtDate(now));
})();

// 云端拉取到新日记时（sync.js 的 rerender 会调 buildNav）刷新界面
function buildNav(){ render(); }

render();
</script>

<!-- 云同步：与昭朝工作台共享同一 Supabase 登录态（同源 localStorage） -->
<script type="module" src="sync.js?v=9"></script>
</body>
</html>
